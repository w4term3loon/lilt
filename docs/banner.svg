<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="256" viewBox="0 0 512 128">
  <title>Ren</title>
  <style>
    @media (prefers-reduced-motion: no-preference) {
      .wren { transform-origin: 64px 64px; animation: arrive 1.9s cubic-bezier(.22,.8,.2,1) both; }
      .left-wing { transform-origin: 20px 94px; animation: flap-left 1.35s ease-in-out both; }
      .right-wing { transform-origin: 108px 94px; animation: flap-right 1.35s ease-in-out both; }
    }
    @keyframes arrive {
      0% { transform: translate(-360px,40px) rotate(-10deg) scale(.85); }
      60% { transform: translate(12px,-4px) rotate(4deg); }
      80% { transform: translate(-3px,2px) rotate(-1deg); }
      100% { transform: none; }
    }
    @keyframes flap-left {
      0%,30%,60% { transform: rotate(42deg) scale(1.6); }
      15%,45% { transform: scale(1.6); }
      80%,100% { transform: none; }
    }
    @keyframes flap-right {
      0%,30%,60% { transform: rotate(-42deg) scale(1.6); }
      15%,45% { transform: scale(1.6); }
      80%,100% { transform: none; }
    }
  </style>
  <rect width="512" height="128" fill="#c6e5f5"/>
  <g transform="translate(192)">
    <g class="wren">
      <path d="M20 64C20 33 35 14 64 14s44 19 44 50v20c0 20 20 28 24 44v72H-4v-72c4-16 24-24 24-44Z" fill="#737c80"/>
      <path class="left-wing" d="M20 94C17 109 0 117-4 128h22c6-10 8-22 2-34Z" fill="#5e696e"/>
      <path class="right-wing" d="M108 94c3 15 20 23 24 34h-22c-6-10-8-22-2-34Z" fill="#5e696e"/>
      <path d="M26 70c10 7 23 9 38 4 15 5 28 3 38-4v26c0 12 4 24 10 32v72H16v-72c6-8 10-20 10-32Z" fill="#d38a50"/>
      <circle cx="42" cy="61" r="4.2" fill="#202322"/>
      <circle cx="86" cy="61" r="4.2" fill="#202322"/>
      <path d="M57 70q7-5 14 0l-7 10Z" fill="#343b3d"/>
    </g>
  </g>
</svg>
