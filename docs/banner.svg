<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="256" viewBox="0 0 512 128">
  <title>Ren</title>
  <style>
    .flight-wings { opacity: 0; }
    @media (prefers-reduced-motion: no-preference) {
      .wren { transform-origin: 64px 64px; animation: arrive 3s cubic-bezier(.2,.65,.3,1) both; }
      .flight-wings { animation: fold-away 3s ease-in-out both; }
      .flight-wing { transform-origin: 26px 82px; animation: wingbeat 3s ease-in-out both; }
    }
    @keyframes arrive {
      0% { transform: translate(-390px,26px) rotate(-8deg) scale(.48); }
      64% { transform: translate(0,-4px) rotate(0deg) scale(.97); animation-timing-function: ease-in-out; }
      82% { transform: translate(0,2px) scale(1.006); animation-timing-function: ease-in-out; }
      100% { transform: none; }
    }
    @keyframes wingbeat {
      0%,24% { transform: rotate(6deg) scaleY(.55); }
      12%,38% { transform: rotate(-12deg) scaleY(.88); }
      52%,66% { transform: none; }
      78% { transform: rotate(-28deg) scale(.78,.9); }
      90% { transform: rotate(-68deg) scale(.22,.7); }
      100% { transform: rotate(-85deg) scale(.025,.5); }
    }
    @keyframes fold-away {
      0%,90% { opacity: 1; }
      100% { opacity: 0; }
    }
  </style>
  <defs>
    <g id="wing">
      <path d="M26 73C5 74-7 61-25 44-45 26-70 28-94 19l-21-9c-9-4-13 1-6 8l31 28-42-21c-9-4-13 1-5 7l39 25-43-14c-10-3-13 4-4 9l40 16-36-5c-10-1-10 7-1 10l42 7-31 2c-8 1-8 9 1 10 28 3 45 0 67-1 29 9 54 18 90 8Z" fill="#5e696e"/>
      <path d="M26 73C5 74-7 61-25 44-45 26-70 28-94 19c8 19 33 39 50 57 20 18 39 25 71 23Z" fill="#a58a71"/>
      <path d="M26 73C9 76-3 66-20 51c7 20 26 35 47 38Z" fill="#d38a50"/>
    </g>
  </defs>
  <rect width="512" height="128" fill="#c6e5f5"/>
  <g transform="translate(192)">
    <g class="wren">
      <g class="flight-wings">
        <g class="flight-wing"><use href="#wing"/></g>
        <g transform="translate(128) scale(-1 1)">
          <g class="flight-wing"><use href="#wing"/></g>
        </g>
      </g>
      <path d="M20 64C20 33 35 14 64 14s44 19 44 50v20c0 20 20 28 24 44v72H-4v-72c4-16 24-24 24-44Z" fill="#737c80"/>
      <path d="M20 94C17 109 0 117-4 128h22c6-10 8-22 2-34Z" fill="#5e696e"/>
      <path d="M108 94c3 15 20 23 24 34h-22c-6-10-8-22-2-34Z" fill="#5e696e"/>
      <path d="M26 70c10 7 23 9 38 4 15 5 28 3 38-4v26c0 12 4 24 10 32v72H16v-72c6-8 10-20 10-32Z" fill="#d38a50"/>
      <circle cx="42" cy="61" r="4.2" fill="#202322"/>
      <circle cx="86" cy="61" r="4.2" fill="#202322"/>
      <path d="M57 70q7-5 14 0l-7 10Z" fill="#343b3d"/>
    </g>
  </g>
</svg>
