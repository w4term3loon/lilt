name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ubuntu:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential git cmake \
            pkg-config libgtk-3-dev libpulse-dev python3 gjs
      - name: Build and check
        run: ./scripts/build.sh
      - name: Check installer syntax
        run: python3 -m compileall -q scripts
